<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فواتير الدكاترة</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="فواتير">
<meta name="theme-color" content="#F7F7F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — blue brand header, scrolling view, fixed bottom tab bar with a centre "+" button, bottom sheets for every form. */
:root{
  --blue:#014FC9; --blue-ink:#0B3E94; --yellow:#F9C03C; --dark:#23232A;
  --bg:#F1F3F8; --surface:#FFFFFF; --fg:#23232A; --muted:#646a7a; --line:#dfe3ec;
  --chip:#e8eefb; --good:#1c8a4f; --good-bg:#e3f4ea; --warn:#a86a00; --warn-bg:#fdf1d6; --bad:#c23b3b;
  --wa:#1f9d55;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17171c; --surface:#23232A; --fg:#F7F7F7; --muted:#a3a7b3; --line:#363641;
  --chip:#1d2a45; --good:#5fd394; --good-bg:#16332a; --warn:#f9c03c; --warn-bg:#3a3018; --bad:#ff8080;
  --blue-ink:#8db4ff; --wa:#38c172; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#17171c; --surface:#23232A; --fg:#F7F7F7; --muted:#a3a7b3; --line:#363641;
  --chip:#1d2a45; --good:#5fd394; --good-bg:#16332a; --warn:#f9c03c; --warn-bg:#3a3018; --bad:#ff8080;
  --blue-ink:#8db4ff; --wa:#38c172; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);direction:rtl;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

header.top{position:sticky;top:0;padding-top:calc(10px + env(safe-area-inset-top,0px)) !important;z-index:5;background:#F7F7F7;color:#23232A;border-bottom:3px solid var(--blue);
  padding:10px 16px;display:flex;align-items:center;gap:10px}
header.top img{height:46px;width:auto}
header.top .t{font:600 17px var(--f-display)}
header.top .s{font-size:12px;opacity:.8}
header.top .back{margin-inline-start:auto;background:#e8eefb;border:0;color:#014FC9;font-weight:600;border-radius:10px;padding:6px 12px;cursor:pointer}

main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h2{font:600 15px var(--f-display);margin:0;color:var(--muted);letter-spacing:.2px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}

.hero{background:var(--dark);color:#F7F7F7;border-radius:18px;padding:18px;display:grid;gap:14px}
.hero .lbl{font-size:13px;opacity:.75}
.hero .big{font:700 34px var(--f-display);line-height:1.1}
.hero .big small{font-size:15px;font-weight:500;opacity:.8;margin-inline-start:4px}
.hero .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .split div{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.hero .split b{display:block;font:600 18px var(--f-display);color:var(--yellow)}

.list{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-bottom:0;width:100%;text-align:start}
.item:first-child{border-top:0}
.item:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.item .main{flex:1;min-width:0}
.item .name,.item .sub{display:block}
.item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font:600 16px var(--f-display);white-space:nowrap}
.av{width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--blue-ink);display:grid;place-items:center;font:600 16px var(--f-display);flex:none}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.due{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.inv{background:var(--chip);color:var(--blue-ink)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font:600 16px var(--f-display);margin-bottom:4px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn.primary{background:var(--blue);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:var(--chip);color:var(--blue-ink)}
.btn.danger{background:none;color:var(--bad);border:1px solid currentColor}
.btn.full{width:100%}
.btn svg{width:20px;height:20px;flex:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}

.dochead{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.dochead .nm{font:700 20px var(--f-display)}
.dochead .meta{font-size:13px;color:var(--muted)}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bal div{background:var(--bg);border-radius:12px;padding:8px 10px}
.bal > div > span{font-size:12px;color:var(--muted);display:block}
.bal b{font:600 15px var(--f-display);white-space:nowrap}
.bal .due b{color:var(--warn)}

.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--blue);color:#fff}

nav.bar{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
nav.bar button{background:none;border:0;cursor:pointer;color:var(--muted);display:grid;justify-items:center;gap:2px;font-size:11px;padding:4px 0}
nav.bar button svg{width:24px;height:24px}
nav.bar button[aria-current="page"]{color:var(--blue-ink)}
nav.bar .fab{width:58px;height:58px;border-radius:50%;background:var(--yellow);color:var(--dark);justify-self:center;margin-top:-26px;
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(1,79,201,.28);font-size:0}
nav.bar .fab svg{width:30px;height:30px}

.scrim{position:fixed;inset:0;background:rgba(15,18,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 0}
.sheet h3{margin:0;font:600 18px var(--f-display)}
label.f{display:grid;gap:6px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;width:100%;min-width:0}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--blue);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px}
.total-line{display:flex;justify-content:space-between;align-items:center;background:var(--chip);border-radius:12px;padding:10px 14px;color:var(--blue-ink);font-weight:600}
.total-line b{font:700 20px var(--f-display)}

.invoice{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.invoice .ih{background:var(--blue);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.invoice .ih b{font:600 16px var(--f-display)}
.invoice table{width:100%;border-collapse:collapse;font-size:14px}
.invoice td{padding:8px 14px;border-top:1px solid var(--line);vertical-align:top}
.invoice td:last-child{text-align:left;white-space:nowrap}
.invoice tr.sum td{font-weight:600}
.invoice tr.due td{font:700 17px var(--f-display);color:var(--blue-ink);background:var(--chip)}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:auto;max-width:420px;background:var(--dark);color:#F7F7F7;
  padding:12px 16px;border-radius:12px;z-index:30;text-align:center;font-weight:500}
.offline{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.kpis div.wide{grid-column:1/-1;background:var(--dark);color:#F7F7F7;border-color:var(--dark)}
.kpis > div > span:first-child{font-size:12px;color:var(--muted)} .kpis .wide > span:first-child{color:#c9cbd3}
.kpis b{font:700 22px var(--f-display)} .kpis .wide b{color:var(--yellow)}
.dl{font-size:12px;color:var(--muted)} .dl.up{color:var(--good)} .dl.down{color:var(--bad)}
.sbar,.pbar{height:8px;border-radius:8px;background:var(--bg);overflow:hidden}
.sbar i,.pbar i{display:block;height:100%;border-radius:8px;background:var(--blue)}
.pbar i{background:var(--good)}
.bal .paid b{color:var(--good)}
.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:170px;padding:12px 12px 8px}
.tcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.tcol i{width:60%;max-width:34px;background:var(--blue);border-radius:4px 4px 0 0;display:block}
.tv{font-size:10px;color:var(--muted)} .tl{font-size:11px;color:var(--muted)}
.pill.st-received{background:var(--chip);color:var(--blue-ink)} .pill.st-working{background:var(--warn-bg);color:var(--warn)} .pill.st-ready{background:var(--good-bg);color:var(--good)}
.rrow{display:grid;gap:8px;border:1px solid var(--line);border-radius:14px;padding:12px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mcell{position:relative;aspect-ratio:1;max-width:100%;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--surface);cursor:pointer}
.mcell img,.mcell video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.mcell.on{outline:3px solid var(--wa);outline-offset:-3px}
.mbadge{position:absolute;top:6px;inset-inline-start:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.mcap{position:absolute;inset-inline:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:11px;padding:14px 6px 4px;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtick{position:absolute;top:6px;inset-inline-end:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3);color:#fff;font-size:13px;display:grid;place-items:center}
.mcell.on .mtick{background:var(--wa);border-color:var(--wa)}
</style>
</head><body>

const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3z"/></svg>';

const DEFAULT_PATIENT_MSG = 'مرحباً {المريض} 👋\nمعك {اسمي}. انسجّل شغلك ({الشغل}) عند {الدكتور} بتاريخ {التاريخ}.\nلأي سؤال احنا بالخدمة 🦷';
const S = { doctors: [], works: [], payments: [], invoices: [], settings: {}, ready: 1, offline: false };
const KEY = 'smilejo-crm-v1';
const COLS = { doctors: 'doctors', works: 'works', payments: 'payments', invoices: 'invoices' };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
let route = { name: 'home', id: null, tab: 'works' };
let searchQ = '';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2 = v => Math.round((+v || 0) * 1000) / 1000;
const cur = () => S.settings.currency || 'د.أ';
const money = v => { const x = n2(v); return x.toLocaleString('en-US', { maximumFractionDigits: 2 }); };
const M = v => `<span style="white-space:nowrap"><span class="num">${money(v)}</span> ${esc(cur())}</span>`;
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const shortDate = s => { if (!s) return ''; const [, m, d] = s.split('-'); return `${d}/${m}`; };
const monthKey = s => (s || '').slice(0, 7);
const initial = name => (String(name || '؟').replace(/^(د\.?|دكتور|دكتورة)\s*/, '').trim()[0] || '؟');
const strip = o => { const { id, ...rest } = o; return rest; };
const docById = id => S.doctors.find(d => d.id === id);
const docName = d => d ? (/^(د\.|د |دكتور)/.test(d.name) ? d.name : 'د. ' + d.name) : 'دكتور محذوف';
function waNumber(p) {
  let x = String(p || '').replace(/[^\d+]/g, '');
  if (!x) return '';
  if (x.startsWith('+')) x = x.slice(1);
  if (x.startsWith('00')) x = x.slice(2);
  if (x.startsWith('07') && x.length === 10) x = '962' + x.slice(1);
  else if (x.startsWith('7') && x.length === 9) x = '962' + x;
  return x;
}
const waLink = (phone, text) => { const n = waNumber(phone); return `https://wa.me/${n}?text=${encodeURIComponent(text)}`; };

function stats(doctorId) {
  const works = S.works.filter(w => w.doctorId === doctorId);
  const pays = S.payments.filter(p => p.doctorId === doctorId);
  const d = docById(doctorId), opening = n2(d && d.openingBalance);
  const billed = works.reduce((a, w) => a + n2(w.total), 0) + opening;
  const paid = pays.reduce((a, p) => a + n2(p.amount), 0);
  const open = works.filter(w => !w.invoiceId);
  return { works, pays, billed, opening, openingDate: (d && d.openingDate) || '', paid, balance: n2(billed - paid), open, openTotal: open.reduce((a, w) => a + n2(w.total), 0) };
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast('انسخ النص'); }
  catch { if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.focus(); fallbackEl.select(); } toast('حدّد النص وانسخه يدوياً'); }
}

/* ---------- data ---------- */
const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0);
function sortAll() {
  S.doctors.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
  S.works.sort(byDateDesc); S.payments.sort(byDateDesc);
  S.invoices.sort((a, b) => (parseInt(b.number, 10) || 0) - (parseInt(a.number, 10) || 0));
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || '{}');
    for (const k of Object.keys(COLS)) S[k] = Array.isArray(d[k]) ? d[k] : [];
    S.settings = d.settings || { businessName: 'SMILE_JO', currency: 'د.أ', footer: 'شكراً لثقتكم بـ SMILE_JO', prices: {} };
  } catch { S.offline = true; }
  sortAll();
}
function persist() {
  const d = { v: 1, savedAt: new Date().toISOString(), settings: S.settings };
  for (const k of Object.keys(COLS)) d[k] = S[k];
  try { localStorage.setItem(KEY, JSON.stringify(d)); return true; }
  catch { toast('ما انحفظ — ذاكرة التلفون ممتلية'); return false; }
}
async function save(col, id, data) {
  if (col === 'settings') { S.settings = { ...data }; }
  else {
    id = id || newId();
    const arr = S[col], i = arr.findIndex(x => x.id === id), rec = { ...data, id };
    if (i >= 0) arr[i] = rec; else arr.push(rec);
    sortAll();
  }
  persist(); render();
  return id;
}
async function remove(col, id) { S[col] = S[col].filter(x => x.id !== id); persist(); render(); }

/* ---------- backup ---------- */
function backupJson() { const d = JSON.parse(localStorage.getItem(KEY) || '{}'); d.exportedAt = new Date().toISOString(); return JSON.stringify(d, null, 1); }
async function exportBackup() {
  const name = `فواتير-نسخة-${today()}.json`;
  const blob = new Blob([backupJson()], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); markBackup(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); markBackup();
}
function markBackup() { try { localStorage.setItem(KEY + '-backup', new Date().toISOString()); } catch {} render(); }
function importBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.doctors)) throw 0;
      openSheet(`<h3>ترجيع نسخة احتياطية</h3><p style="margin:0">النسخة فيها ${d.doctors.length} دكتور و${(d.works || []).length} شغل. البيانات الحالية رح تتبدّل فيها.</p>
        <button class="btn primary" id="yes">آه، رجّعها</button><button class="btn ghost" data-close>إلغاء</button>`, sh => {
        sh.querySelector('#yes').onclick = () => {
          for (const k of Object.keys(COLS)) S[k] = Array.isArray(d[k]) ? d[k] : [];
          S.settings = d.settings || {}; sortAll(); persist(); closeSheet(); render(); toast('رجعت البيانات');
        };
      });
    } catch { toast('هاد الملف مش نسخة احتياطية من التطبيق'); }
  };
  r.readAsText(file);
}

/* ---------- views ---------- */
function render() {
  const v = $('#view');
  document.querySelectorAll('nav.bar [data-go]').forEach(b => b.setAttribute('aria-current', b.dataset.go === route.name || ((route.name === 'doctor' && b.dataset.go === 'doctors') || (['invoices', 'library'].includes(route.name) && b.dataset.go === 'settings')) ? 'page' : 'false'));
  $('#backBtn').hidden = !['doctor', 'invoices', 'library'].includes(route.name);
  $('#hTitle').textContent = 'فواتير الدكاترة';
  $('#hSub').textContent = S.settings.businessName || 'SMILE_JO';
  let html = '';
  if (S.offline) html += `<div class="offline">التلفون مانع الحفظ (ممكن تصفّح خاص). افتح التطبيق من أيقونته على الشاشة.</div>`;
  if (route.name === 'home') html += viewHome();
  else if (route.name === 'doctors') html += viewDoctors();
  else if (route.name === 'doctor') html += viewDoctor();
  else if (route.name === 'invoices') html += viewInvoices();
  else if (route.name === 'settings') html += viewSettings();
  else if (route.name === 'library') html += viewLibrary();
  else if (route.name === 'stats') html += viewStats();
  const keepSearch = route.name === 'doctors' && document.activeElement && document.activeElement.id === 'q';
  if (keepSearch) { $('#docList').innerHTML = doctorRows(); return; }
  v.innerHTML = html;
  if (route.name === 'settings') fillSettings();
}

function doctorRow(d) {
  const st = stats(d.id);
  const pill = st.balance > 0 ? `<span class="pill due">عليه ${M(st.balance)}</span>` : st.balance < 0 ? `<span class="pill ok">له ${M(-st.balance)}</span>` : `<span class="pill ok">خالص</span>`;
  return `<button class="item" data-doc="${esc(d.id)}"><span class="av">${esc(initial(d.name))}</span>
    <span class="main"><span class="name">${esc(docName(d))}</span><span class="sub">${esc(d.clinic || '')}${d.clinic && st.open.length ? ' · ' : ''}${st.open.length ? st.open.length + ' شغل مش مفوتر' : ''}</span></span>${pill}</button>`;
}
function doctorRows() {
  const q = searchQ.trim();
  const list = S.doctors.filter(d => !q || (d.name + ' ' + (d.clinic || '') + ' ' + (d.phone || '')).includes(q));
  if (!S.doctors.length) return `<div class="empty"><b>لسا ما ضفت ولا دكتور</b>اضغط «دكتور جديد» وحط اسمه ورقم الواتس تبعه.</div>`;
  if (!list.length) return `<div class="empty">ما في دكتور بهالاسم</div>`;
  return list.map(doctorRow).join('');
}

function viewHome() {
  const mk = monthKey(today());
  const totalDue = S.doctors.reduce((a, d) => a + Math.max(0, stats(d.id).balance), 0);
  const monthWork = S.works.filter(w => monthKey(w.date) === mk).reduce((a, w) => a + n2(w.total), 0);
  const monthPaid = S.payments.filter(p => monthKey(p.date) === mk).reduce((a, p) => a + n2(p.amount), 0);
  const owing = S.doctors.map(d => ({ d, st: stats(d.id) })).filter(x => x.st.balance > 0 || x.st.open.length).sort((a, b) => b.st.balance - a.st.balance);
  const recent = S.works.slice(0, 6);
  const monthName = new Date().toLocaleDateString('ar-JO-u-nu-latn', { month: 'long' });
  return `
  <section class="hero" aria-label="الملخص">
    <div><div class="lbl">المطلوب من كل الدكاترة</div><div class="big"><span class="num">${money(totalDue)}</span><small>${esc(cur())}</small></div></div>
    <div class="split">
      <div><span class="lbl">شغل شهر ${esc(monthName)}</span><b class="num">${money(monthWork)}</b></div>
      <div><span class="lbl">قبضت بشهر ${esc(monthName)}</span><b class="num">${money(monthPaid)}</b></div>
    </div>
  </section>
  ${S.doctors.length ? '' : `<div class="list"><div class="empty"><b>أهلاً فيك 👋</b>ابدأ بإضافة أول دكتور، بعدين سجّل الشغل من زر <b style="display:inline">+</b> الأصفر، ولما تخلص ابعتله الفاتورة على الواتس.</div><div style="padding:0 14px 14px"><button class="btn primary full" data-act="newDoctor">+ دكتور جديد</button></div></div>`}
  ${backupNag()}
  ${(() => { const t = today(); const due = S.works.filter(w => w.due && w.status !== 'delivered' && w.status !== 'ready' && w.due <= t).sort((a, b) => a.due.localeCompare(b.due));
    const ready = S.works.filter(w => w.status === 'ready');
    return (due.length ? `<h2>مطلوب تسليمه اليوم أو متأخر (${due.length})</h2><div class="list">${due.slice(0, 8).map(w => workRow(w)).join('')}</div>` : '') +
      (ready.length ? `<h2>جاهز بستنى تسليم (${ready.length})</h2><div class="list">${ready.slice(0, 8).map(w => workRow(w)).join('')}</div>` : ''); })()}
  ${owing.length ? `<div class="row between"><h2>دكاترة عليهم حساب</h2></div><div class="list">${owing.map(x => doctorRow(x.d)).join('')}</div>` : ''}
  ${S.invoices.length ? `<button class="btn ghost full" data-go="invoices">كل الفواتير (<span class="num">${S.invoices.length}</span>)</button>` : ''}
  ${recent.length ? `<h2>آخر شغل</h2><div class="list">${recent.map(workRow).join('')}</div>` : ''}`;
}

function backupNag() {
  if (!S.works.length) return '';
  let last = null; try { last = localStorage.getItem(KEY + '-backup'); } catch {}
  const days = last ? (Date.now() - Date.parse(last)) / 864e5 : 999;
  if (days < 7) return '';
  return `<div class="offline row between"><span>${last ? 'صرلك أسبوع ما عملت نسخة احتياطية' : 'اعمل نسخة احتياطية عشان ما تضيع بياناتك لو صار إشي للتلفون'}</span><button class="btn ghost" style="padding:6px 12px" data-act="backup">نسخة</button></div>`;
}
function workRow(w, showDoc = true) {
  const d = docById(w.doctorId);
  const inv = S.invoices.find(i => i.id === w.invoiceId);
  const stp = w.status && w.status !== 'delivered' ? `<span class="pill st-${w.status}">${statusLabel(w.status)}${w.due && w.status !== 'ready' ? ' · ' + shortDate(w.due) : ''}</span>` : '';
  const tag = w.invoiceId ? `<span class="pill inv">فاتورة ${esc(inv ? inv.number : '')}</span>` : `<span class="pill due">مش مفوتر</span>`;
  const qty = n2(w.qty) > 1 ? ` × ${money(w.qty)}` : '';
  const rest = [w.caseNo ? 'حالة ' + w.caseNo : '', showDoc ? docName(d) : '', w.patient ? 'المريض: ' + w.patient : ''].filter(Boolean).map(x => ' · ' + esc(x)).join('');
  return `<button class="item" data-work="${esc(w.id)}"><span class="main"><span class="name">${esc(w.type)}${qty}</span><span class="sub"><span class="num">${esc(shortDate(w.date))}</span>${rest}</span></span>
    <span style="display:grid;justify-items:end;gap:2px"><span class="amt">${M(w.total)}</span><span class="row" style="gap:4px">${stp}${tag}</span></span></button>`;
}

function viewDoctors() {
  return `<div class="row"><input class="search" id="q" type="search" placeholder="دوّر على دكتور…" value="${esc(searchQ)}" aria-label="بحث"></div>
  <button class="btn primary full" data-act="newDoctor">+ دكتور جديد</button>
  <div class="list" id="docList">${doctorRows()}</div>`;
}

function viewDoctor() {
  const d = docById(route.id);
  if (!d) return `<div class="list"><div class="empty">${S.ready ? 'هالدكتور مش موجود' : 'لحظة…'}</div></div>`;
  const st = stats(d.id);
  const tab = route.tab;
  let body = '';
  const openRow = st.opening ? `<button class="item" data-act="editDoctor"><span class="av" style="border-radius:10px;background:var(--warn-bg);color:var(--warn)">⏳</span><span class="main"><span class="name">حساب قديم</span><span class="sub">لغاية <span class="num">${esc(fmtDate(st.openingDate))}</span>${d.openingNote ? ' · ' + esc(d.openingNote) : ''}</span></span><span class="amt">${M(st.opening)}</span></button>` : '';
  if (tab === 'works') body = (st.works.length ? st.works.map(w => workRow(w, false)).join('') : (st.opening ? '' : `<div class="empty"><b>ما في شغل مسجّل</b>اضغط «سجّل شغل» تحت.</div>`)) + openRow;
  if (tab === 'pays') body = st.pays.length ? st.pays.map(payRow).join('') : `<div class="empty"><b>ما في دفعات</b>لما يدفعلك اضغط «سجّل دفعة».</div>`;
  if (tab === 'docs') { const sc = MEDIA.list.filter(m => m.kind === 'scan' && m.doctorId === d.id); body = sc.length ? `<div class="mgrid" style="padding:8px">${sc.map(m => `<button class="mcell" data-scan="${esc(m.id)}"><img src="${mUrl(m)}" alt=""><span class="mcap">${esc(fmtDate(new Date(m.createdAt).toISOString().slice(0, 10)))}</span></button>`).join('')}</div>` : `<div class="empty"><b>ما في أوراق</b>اضغط «امسح ورقة» وصوّر ورقة الشغل.</div>`; }
  if (tab === 'invs') { const invs = S.invoices.filter(i => i.doctorId === d.id); body = invs.length ? invs.map(i => invRow(i, false)).join('') : `<div class="empty">لسا ما بعتتله فاتورة</div>`; }
  return `
  <section class="dochead">
    <div class="row"><span class="av">${esc(initial(d.name))}</span><div class="main" style="flex:1;min-width:0"><div class="nm">${esc(docName(d))}</div>
      <div class="meta">${esc(d.clinic || '')}${d.clinic && d.phone ? ' · ' : ''}<span class="num">${esc(d.phone || '')}</span></div></div>
      <button class="btn ghost" data-act="editDoctor" style="padding:8px 12px">تعديل</button></div>
    <div class="bal">
      <div><span>كل الشغل</span><b>${M(st.billed)}</b></div>
      <div class="paid"><span>دفع</span><b>${M(st.paid)}</b></div>
      <div class="due"><span>${st.balance < 0 ? 'إله رصيد' : 'باقي عليه'}</span><b>${M(Math.abs(st.balance))}</b></div>
    </div>
    ${st.opening ? `<p class="note" style="margin:0">منها حساب قديم ${M(st.opening)}</p>` : `<button class="btn ghost" data-act="editDoctor" style="padding:6px 12px;justify-self:start;font-size:13px">+ ضيف حساب قديم</button>`}
    <div class="pbar" title="دفع ${st.billed ? Math.round(st.paid / st.billed * 100) : 0}%"><i style="width:${st.billed ? Math.min(100, st.paid / st.billed * 100) : 0}%"></i></div>
    <div class="row between note"><span>دفع <b class="num">${st.billed ? Math.min(100, Math.round(st.paid / st.billed * 100)) : 0}%</b> من الحساب</span><span>${st.pays[0] ? 'آخر دفعة: <span class="num">' + esc(fmtDate(st.pays[0].date)) + '</span>' : 'ما دفع لسا'}</span></div>
    ${oldestUnpaidDays(d.id) > 30 ? `<button class="offline row between" data-act="remind" style="border:0;width:100%;cursor:pointer;text-align:start"><span>⚠️ في حساب متأخر من <b class="num">${oldestUnpaidDays(d.id)}</b> يوم</span><b>ذكّره</b></button>` : ''}
    <button class="btn wa full" data-act="invoice">${WA_ICON} ابعت فاتورة على الواتس${st.open.length ? ` (${st.open.length} شغل جديد)` : ''}</button>
    <div class="actions"><button class="btn primary" data-act="newWork">+ سجّل شغل</button><button class="btn ghost" data-act="newPay">سجّل دفعة</button></div>
    <div class="actions"><button class="btn ghost" data-act="scan">📷 امسح ورقة</button><button class="btn ghost" data-act="report">📊 تقرير الشهر</button></div>
    ${st.balance > 0 ? `<button class="btn ghost full" data-act="remind">🔔 ذكّره بالدفع</button>` : ''}
  </section>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="works" aria-selected="${tab === 'works'}">الشغل</button>
    <button role="tab" data-tab="pays" aria-selected="${tab === 'pays'}">الدفعات</button>
    <button role="tab" data-tab="invs" aria-selected="${tab === 'invs'}">الفواتير</button>
    <button role="tab" data-tab="docs" aria-selected="${tab === 'docs'}">الأوراق</button>
  </div>
  <div class="list">${body}</div>`;
}

function payRow(p) {
  return `<button class="item" data-pay="${esc(p.id)}"><span class="av" style="background:var(--good-bg);color:var(--good)">✓</span>
    <span class="main"><span class="name">دفعة ${esc(p.method || '')}</span><span class="sub"><span class="num">${esc(fmtDate(p.date))}</span>${p.note ? ' · ' + esc(p.note) : ''}</span></span><span class="amt" style="color:var(--good)">${M(p.amount)}</span></button>`;
}
function invRow(i, showDoc = true) {
  const d = docById(i.doctorId);
  return `<button class="item" data-inv="${esc(i.id)}"><span class="av" style="border-radius:10px">#</span>
    <span class="main"><span class="name">فاتورة <span class="num">${esc(i.number)}</span>${showDoc ? ' · ' + esc(docName(d)) : ''}</span><span class="sub"><span class="num">${esc(fmtDate(i.date))}</span> · ${(i.workIds || []).length} شغل</span></span><span class="amt">${M(i.due)}</span></button>`;
}
function viewInvoices() {
  return `<h2>كل الفواتير اللي انبعتت</h2><div class="list">${S.invoices.length ? S.invoices.map(i => invRow(i)).join('') : `<div class="empty"><b>لسا ما في فواتير</b>افتح صفحة أي دكتور واضغط «ابعت فاتورة على الواتس».</div>`}</div>`;
}

function viewSettings() {
  return `<div class="actions">
    <button class="btn ghost" data-go="library">🖼️ مكتبة الصور</button>
    <button class="btn ghost" data-go="invoices">🧾 كل الفواتير</button>
  </div>
  <button class="btn primary full" data-act="demo">👀 شوف فاتورة تجريبية</button>
  <h2>الإعدادات</h2>

/* ---------- media library (IndexedDB on the phone) ---------- */
const MEDIA = { list: [], urls: new Map(), filter: 'all', selecting: false, sel: new Set(), usage: '' };
let _idb = null;
function idb() {
  return _idb || (_idb = new Promise((res, rej) => {
    const r = indexedDB.open('smilejo-media', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('media', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => { const tx = db.transaction('media', mode); const q = fn(tx.objectStore('media')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); });
}
async function mediaLoad() {
  try { MEDIA.list = (await idbDo('readonly', st => st.getAll())) || []; } catch { MEDIA.list = []; }
  MEDIA.list.sort((a, b) => b.createdAt - a.createdAt);
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); MEDIA.usage = `مستعمل ${(e.usage / 1048576).toFixed(0)} MB`; } } catch {}
  if (route.name === 'library') render();
}
const mUrl = m => { if (!MEDIA.urls.has(m.id)) MEDIA.urls.set(m.id, URL.createObjectURL(m.blob)); return MEDIA.urls.get(m.id); };
const isVid = m => (m.type || '').startsWith('video');
function viewLibrary() {
  const lib = MEDIA.list.filter(m => !m.kind);
  const list = lib.filter(m => MEDIA.filter === 'all' || (MEDIA.filter === 'video') === isVid(m));
  const f = (k, l) => `<button type="button" data-mfilter="${k}" aria-selected="${MEDIA.filter === k}">${l}</button>`;
  return `<div class="row between"><h2>مكتبة الصور والفيديوهات</h2><span class="note num">${esc(MEDIA.usage)}</span></div>
  <label class="btn primary full" for="mFile">+ ضيف صور أو فيديوهات</label>
  <input type="file" id="mFile" accept="image/*,video/*" multiple hidden>
  ${lib.length ? `<div class="tabs" role="tablist">${f('all', 'الكل')}${f('image', 'صور')}${f('video', 'فيديو')}</div>
  <div class="row between"><span class="note">${MEDIA.selecting ? `اختار اللي بدك تبعته (${MEDIA.sel.size})` : 'اضغط على أي صورة عشان تبعتها لدكتور'}</span>
    <button class="btn ghost" style="padding:6px 12px" data-act="mselect">${MEDIA.selecting ? 'إلغاء' : 'اختار كذا وحدة'}</button></div>
  <div class="mgrid">${list.map(m => `<button class="mcell${MEDIA.sel.has(m.id) ? ' on' : ''}" data-media="${esc(m.id)}">
      ${isVid(m) ? `<video src="${mUrl(m)}#t=0.1" muted playsinline preload="metadata"></video><span class="mbadge">▶︎</span>` : `<img src="${mUrl(m)}" alt="" loading="lazy">`}
      ${m.caption ? `<span class="mcap">${esc(m.caption)}</span>` : ''}${MEDIA.selecting ? `<span class="mtick">${MEDIA.sel.has(m.id) ? '✓' : ''}</span>` : ''}</button>`).join('')}</div>
  ${MEDIA.selecting && MEDIA.sel.size ? `<button class="btn wa full" data-act="mshareSel">${WA_ICON} شارك ${MEDIA.sel.size} على الواتس</button>` : ''}`
  : `<div class="list"><div class="empty"><b>المكتبة فاضية</b>ضيف صور الشغل الجديد، قبل وبعد، والفيديوهات، وبعدين ابعتها لأي دكتور بضغطة.</div></div>`}
  <p class="note" style="margin:0">الصور محفوظة على التلفون بس، وما بتدخل بالنسخة الاحتياطية. خلي نسخة منها بالألبوم عندك.</p>`;
}
async function addMedia(files) {
  let n = 0;
  for (const file of files) {
    try { await idbDo('readwrite', st => st.put({ id: newId(), name: file.name, type: file.type, blob: file, caption: '', createdAt: Date.now() + n })); n++; }
    catch { toast('ما في مساحة كافية على التلفون'); break; }
  }
  if (n) toast(`انضاف ${n}`);
  await mediaLoad(); render();
}
function shareFiles(items, text) {
  const files = items.map(m => new File([m.blob], m.name || ('smilejo-' + m.id + (isVid(m) ? '.mp4' : '.jpg')), { type: m.type }));
  if (text && navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
  if (navigator.canShare && navigator.canShare({ files })) {
    navigator.share(text ? { files, text } : { files }).then(() => {}).catch(() => {});
  } else toast('التلفون ما سمح بالمشاركة — جرّب من أيقونة التطبيق');
}
function mediaSheet(m) {
  openSheet(`<h3>${isVid(m) ? 'فيديو' : 'صورة'}</h3>
    ${isVid(m) ? `<video src="${mUrl(m)}" controls playsinline style="width:100%;border-radius:12px;max-height:50vh;background:#000"></video>` : `<img src="${mUrl(m)}" alt="" style="width:100%;border-radius:12px;max-height:50vh;object-fit:contain;background:var(--bg)">`}
    <label class="f">الكلام اللي بينبعت معها<textarea id="mCap" rows="2" placeholder="مثلاً: شغل جديد وصل! ريتينر شفاف بلون مخصص">${esc(m.caption)}</textarea></label>
    <button class="btn wa full" id="mShare">${WA_ICON} ابعتها لدكتور على الواتس</button>
    <p class="note" style="margin:0">بيفتحلك قائمة المشاركة ← اختار واتساب ← اختار الدكاترة. الكلام بينسخ لحاله، إذا ما طلع الصقه.</p>
    <div class="confirm" id="delWrap"><button type="button" class="btn danger" id="delBtn">حذف</button></div>
    <button class="btn ghost full" data-close>سكّر</button>`, sh => {
    const cap = sh.querySelector('#mCap');
    const keep = async () => { if (cap.value.trim() !== (m.caption || '')) { m = { ...m, caption: cap.value.trim() }; await idbDo('readwrite', st => st.put(m)); mediaLoad(); } };
    cap.addEventListener('change', keep);
    sh.querySelector('#mShare').onclick = () => { shareFiles([m], cap.value.trim()); keep(); };
    sh.querySelector('#delBtn').onclick = () => {
      sh.querySelector('#delWrap').innerHTML = `<span>متأكد؟</span><button type="button" class="btn danger" id="yes">آه، احذف</button>`;
      sh.querySelector('#yes').onclick = async () => { await idbDo('readwrite', st => st.delete(m.id)); URL.revokeObjectURL(MEDIA.urls.get(m.id)); MEDIA.urls.delete(m.id); closeSheet(); await mediaLoad(); render(); toast('انحذف'); };
    };
  });
}

/* ---------- sheets ---------- */
function openSheet(html, onMount) {
  closeSheet();
  const sc = document.createElement('div'); sc.className = 'scrim'; sc.id = 'scrim';
  sc.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${html}</div>`;
  sc.addEventListener('click', e => { if (e.target === sc || e.target.closest('[data-close]')) closeSheet(); });
  document.body.appendChild(sc);
  onMount && onMount(sc.querySelector('.sheet'));
}
function closeSheet() { const s = $('#scrim'); if (s) s.remove(); }

let statMonth = null;
function monthsBack(n) { const out = [], d = new Date(); d.setDate(1); for (let i = 0; i < n; i++) { out.unshift(d.toISOString().slice(0, 7)); d.setMonth(d.getMonth() - 1); } return out; }
const mLabel = (m, opt = { month: 'long', year: 'numeric' }) => { const [y, mm] = m.split('-'); return new Date(+y, +mm - 1, 1).toLocaleDateString('ar-JO-u-nu-latn', opt); };
const prevMonth = m => { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 2, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
function agg(works) {
  const t = {}; let teeth = 0, total = 0;
  for (const w of works) { const r = t[w.type] || (t[w.type] = { teeth: 0, cases: 0, total: 0 }); r.teeth += n2(w.qty); r.cases++; r.total += n2(w.total); teeth += n2(w.qty); total += n2(w.total); }
  return { t, teeth, total, cases: new Set(works.map(w => w.doctorId + '|' + (w.caseNo || w.id))).size };
}
function delta(now, before) {

}

/* ---------- scan a paper (photo -> enhanced copy -> optional AI read -> review) ---------- */
async function loadImg(file) { const img = new Image(); img.src = URL.createObjectURL(file); await img.decode(); return img; }
async function enhanceScan(file) {
  const img = await loadImg(file), max = 1800, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
  const x = cv.getContext('2d'); x.drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(img.src);
  const id = x.getImageData(0, 0, cv.width, cv.height), p = id.data;
  for (let i = 0; i < p.length; i += 4) { let g = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]; g = Math.max(0, Math.min(255, (g - 60) * 1.6)); p[i] = p[i + 1] = p[i + 2] = g; }
  x.putImageData(id, 0, 0);
  return { blob: await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85)), b64: cv.toDataURL('image/jpeg', 0.85).split(',')[1] };
}
async function aiRead(b64, doctor) {
  const { default: Anthropic } = await import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.130.0/+esm');
  const client = new Anthropic({ apiKey: S.settings.apiKey, dangerouslyAllowBrowser: true });
  const known = [...new Set(S.works.map(w => w.type))].slice(0, 30).join('، ');
  const schema = { type: 'object', additionalProperties: false, required: ['items'], properties: { items: { type: 'array', items: { type: 'object', additionalProperties: false,
    required: ['date', 'caseNo', 'patient', 'type', 'teeth', 'qty', 'price'],
    properties: { date: { type: 'string' }, caseNo: { type: 'string' }, patient: { type: 'string' }, type: { type: 'string' }, teeth: { type: 'string' }, qty: { type: 'number' }, price: { type: 'number' } } } } } };
  const r = await client.beta.messages.create({
    model: 'claude-opus-5-5', max_tokens: 16000,
    betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default',
    output_config: { effort: 'medium', format: { type: 'json_schema', schema } },
    messages: [{ role: 'user', content: [
      { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
      { type: 'text', text: `هاي صورة ورقة شغل لمختبر أسنان من ${docName(doctor)}. استخرج كل سطر شغل (حالة) فيها.
لكل سطر: date بصيغة YYYY-MM-DD (إذا ما في سنة استعمل ${today().slice(0, 4)}، وإذا ما في تاريخ اتركه فاضي)، caseNo رقم الحالة، patient اسم المريض، type نوع السن/الشغل (مثل زيركون، إيماكس، بورسلين، PFM، تاج مؤقت، طقم)، teeth أرقام الأسنان مفصولة بفواصل، qty عدد الأسنان (إذا في أرقام أسنان، عددها)، price سعر السن إذا مكتوب وإلا 0.
${known ? 'أنواع الشغل اللي بنستعملها عادةً: ' + known + '. استعمل نفس التسمية لو نفس النوع.' : ''}
اكتب الأسماء بالعربي متل ما مكتوبة. إذا الحقل مش واضح اتركه فاضي، لا تخمّن.` } ] }],
  });
  if (r.stop_reason === 'refusal') throw new Error('refusal');
  const t = r.content.find(c => c.type === 'text');
  return t ? (JSON.parse(t.text).items || []) : [];
}

function nextCase() { const max = S.works.reduce((a, w) => Math.max(a, parseInt(w.caseNo, 10) || 0), 0); return String(max ? max + 1 : 1); }
const C = { blue: '#014FC9', yellow: '#F9C03C', dark: '#23232A', muted: '#6b7080', line: '#E3E6EE', soft: '#F3F5FB', white: '#FFFFFF' };
const FD = '"Readex Pro","IBM Plex Sans Arabic",sans-serif', FB = '"IBM Plex Sans Arabic","Readex Pro",sans-serif';
let _logoImg = null;
async function prepDraw() {
  try { await Promise.all(['700 40px "Readex Pro"', '600 40px "Readex Pro"', '400 20px "IBM Plex Sans Arabic"', '600 20px "IBM Plex Sans Arabic"'].map(f => document.fonts.load(f, 'فاتورة 123'))); } catch {}

}
function fit(x, t, w) { t = String(t ?? ''); if (x.measureText(t).width <= w) return t; while (t.length > 1 && x.measureText(t + '…').width > w) t = t.slice(0, -1); return t + '…'; }

function docHead(x, W, M, title, lines) {

  const lh = 150, lw = _logoImg && _logoImg.naturalWidth ? lh * _logoImg.naturalWidth / _logoImg.naturalHeight : 0;
  if (lw) x.drawImage(_logoImg, W - M - lw, 52, lw, lh);

  txt(x, s.businessName || 'SMILE_JO', W - M - lw - 26, 112, { font: `700 36px ${FD}` });
  if (s.phone) txt(x, s.phone, W - M - lw - 26, 154, { font: `400 26px ${FB}`, color: C.muted });

}
function docTo(x, W, M, Y, d, side) {
  rr(x, M, Y, W - 2 * M, 120, 18, C.soft);
  txt(x, 'إلى', W - M - 30, Y + 42, { font: `500 22px ${FB}`, color: C.muted });
  txt(x, docName(d), W - M - 30, Y + 88, { font: `700 36px ${FD}`, max: 560 });
  if (d.clinic) txt(x, d.clinic, W - M - 30 - Math.min(560, (x.font = `700 36px ${FD}`, x.measureText(docName(d)).width)) - 20, Y + 88, { font: `400 24px ${FB}`, color: C.muted, max: 260 });

}

async function drawInvoice(inv, d, works, photos = []) {
  await prepDraw();
  const W = 1240, M = 64, rowH = 84, c = cur(), s = S.settings;
  const tableY = 420, rowsY = tableY + 64, endRows = rowsY + Math.max(1, works.length) * rowH;
  const ph = photos.length ? 90 + Math.ceil(photos.length / 4) * 300 : 0;

  const x = cv.getContext('2d'); x.direction = 'rtl';
  x.fillStyle = C.white; x.fillRect(0, 0, W, H);
  docHead(x, W, M, 'فاتورة', [`رقم الفاتورة: ${inv.number}`, `التاريخ: ${fmtDate(inv.date)}`]);
  const teeth = works.reduce((a, w) => a + n2(w.qty), 0);
  docTo(x, W, M, 250, d, [`عدد الحالات: ${works.length}`, `عدد الأسنان: ${money(teeth)}`]);

  const cols = [['#', 50, 'c'], ['رقم الحالة', 130, 'c'], ['التاريخ', 130, 'c'], ['اسم المريض', 220, 'r'], ['نوع السن', 230, 'r'], ['عدد الأسنان', 100, 'c'], ['سعر السن', 110, 'c'], ['المجموع', 142, 'c']];

  let cx = W - M;
  const pos = cols.map(([h, w, a]) => { const p = { r: cx, w, a }; cx -= w; return p; });
  cols.forEach(([h], i) => { const p = pos[i]; txt(x, h, p.a === 'c' ? p.r - p.w / 2 : p.r - 14, tableY + 41, { font: `600 22px ${FB}`, color: C.white, align: p.a === 'c' ? 'center' : 'right' }); });
  works.forEach((w, i) => {
    const y = rowsY + i * rowH;
    if (i % 2) { x.fillStyle = C.soft; x.fillRect(M, y, W - 2 * M, rowH); }
    const cells = [String(i + 1), w.caseNo || '—', fmtDate(w.date).replace(/\/(\d\d)(\d\d)$/, '/$2'), w.patient || '—', w.type, money(w.qty), money(w.price), money(w.total)];
    cells.forEach((v, j) => {
      const p = pos[j], center = p.a === 'c', X = center ? p.r - p.w / 2 : p.r - 14;
      const bold = j === 7, y0 = j === 4 && w.teeth ? y + 38 : y + 52;
      txt(x, v, X, y0, { font: `${bold ? 700 : 500} ${j === 7 ? 25 : 23}px ${bold ? FD : FB}`, align: center ? 'center' : 'right', max: p.w - 20 });
      if (j === 4 && w.teeth) txt(x, 'الأسنان: ' + teethList(w.teeth).join('، '), X, y + 68, { font: `400 18px ${FB}`, color: C.muted, max: p.w - 20 });
    });
    x.fillStyle = C.line; x.fillRect(M, y + rowH - 1, W - 2 * M, 1);
  });
  if (!works.length) txt(x, 'تذكير بالرصيد المطلوب', W / 2, rowsY + 52, { font: `500 24px ${FB}`, color: C.muted, align: 'center' });
  // totals (left) + payment info (right)
  const tY = endRows + 36, tw = 470;
  let ly = tY;
  const tl = (a, b, col = C.dark) => { txt(x, a, M + tw - 24, ly + 34, { font: `500 25px ${FB}`, color: C.muted }); txt(x, b, M + 24, ly + 34, { font: `600 27px ${FD}`, color: col, align: 'left' }); ly += 52; };
  tl('مجموع الشغل', `${money(inv.itemsTotal)} ${c}`);
  if (n2(inv.prevBalance) > 0) tl('رصيد سابق', `${money(inv.prevBalance)} ${c}`);
  if (n2(inv.prevBalance) < 0) tl('رصيد إلك عنا', `- ${money(-inv.prevBalance)} ${c}`, '#1c8a4f');
  rr(x, M, ly + 8, tw, 96, 16, C.blue);
  txt(x, 'المطلوب', M + tw - 26, ly + 68, { font: `600 28px ${FD}`, color: C.white });
  txt(x, `${money(Math.max(0, inv.due))} ${c}`, M + 26, ly + 70, { font: `700 40px ${FD}`, color: C.yellow, align: 'left' });
  if (s.payInfo) {
    rr(x, W - M - 560, tY, 560, 150, 16, C.soft);
    txt(x, 'طريقة الدفع', W - M - 28, tY + 46, { font: `600 24px ${FD}`, color: C.blue });
    txt(x, s.payInfo, W - M - 28, tY + 96, { font: `500 24px ${FB}`, max: 500 });

      const iw = p.img.naturalWidth || p.img.width, ih = p.img.naturalHeight || p.img.height, k = Math.max(cw / iw, chh / ih);

async function workPhotos(works) {

    try { out.push({ img: await loadImg(m.blob), label: [w.patient, w.type].filter(Boolean).join(' · ') }); } catch {}
  }

}
async function drawReport(d, month) {

  const byType = {};
  works.forEach(w => { const t = byType[w.type] || (byType[w.type] = { n: 0, total: 0 }); t.n += n2(w.qty); t.total += n2(w.total); });
  const types = Object.entries(byType).sort((a, b) => b[1].n - a[1].n);
  const W = 1240, M = 64, c = cur();
  const H = 640 + 70 + Math.max(1, types.length) * 74 + 200 + 160;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d'); x.direction = 'rtl';
  x.fillStyle = C.white; x.fillRect(0, 0, W, H);
  const [yy, mm] = month.split('-');
  const mName = new Date(+yy, +mm - 1, 1).toLocaleDateString('ar-JO-u-nu-latn', { month: 'long', year: 'numeric' });
  docHead(x, W, M, 'تقرير شهري', [mName]);
  docTo(x, W, M, 250, d, []);
  const teeth = works.reduce((a, w) => a + n2(w.qty), 0), total = works.reduce((a, w) => a + n2(w.total), 0);
  const cases = new Set(works.map(w => w.caseNo || w.id)).size, bal = stats(d.id).balance;
  const tiles = [['عدد الحالات', String(cases)], ['عدد الأسنان', money(teeth)], ['مجموع الشغل', `${money(total)} ${c}`], ['المطلوب للآن', `${money(Math.max(0, bal))} ${c}`]];
  const tw = (W - 2 * M - 3 * 20) / 4;
  tiles.forEach(([l, v], i) => {
    const X = W - M - (i + 1) * tw - i * 20, Y = 410;
    rr(x, X, Y, tw, 170, 18, i === 3 ? C.blue : C.soft);
    txt(x, l, X + tw - 22, Y + 50, { font: `500 23px ${FB}`, color: i === 3 ? '#cfe0ff' : C.muted });

  });
  let y = 640;
  txt(x, 'الشغل حسب نوع السن', W - M, y, { font: `600 30px ${FD}` });
  y += 34;

    rr(x, W - M - 300 - barW, y + 20, barW, 34, 17, C.soft);

    txt(x, `${money(t.n)} سن`, W - M - 300 - barW - 20, y + 46, { font: `600 24px ${FD}`, align: 'right' });
    txt(x, `${money(t.total)} ${c}`, M, y + 46, { font: `500 22px ${FB}`, color: C.muted, align: 'left' });
    y += 74;
  });
  if (!types.length) { txt(x, 'ما في شغل مسجّل بهالشهر', W / 2, y + 46, { font: `500 26px ${FB}`, color: C.muted, align: 'center' }); y += 74; }
  const paid = pays.reduce((a, p) => a + n2(p.amount), 0);
  y += 30;

  txt(x, `شكراً لثقتك ${docName(d)} — ${cases} حالة و${money(teeth)} سن هالشهر`, W - M - 30, y + 54, { font: `600 28px ${FD}`, max: W - 2 * M - 60 });
  txt(x, paid ? `المدفوع هالشهر: ${money(paid)} ${c}` : 'بنفتخر إنا جزء من ابتسامات مرضاك', W - M - 30, y + 96, { font: `400 23px ${FB}`, color: C.muted });

}
const cvFile = (cv, name) => new Promise(r => cv.toBlob(b => r(new File([b], name, { type: 'image/png' })), 'image/png'));
function shareImage(file, text) {
  if (text && navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
  if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(() => {}); return true; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return false;
}

/* ---------- invoice ---------- */
function invoiceText(inv, d, works) {
  const s = S.settings, c = cur();
  const L = [];
  L.push(`*فاتورة رقم ${inv.number}*`);
  L.push(`${s.businessName || 'SMILE_JO'}${s.phone ? ' — ' + s.phone : ''}`);
  L.push(`التاريخ: ${fmtDate(inv.date)}`);
  L.push(`إلى: ${docName(d)}${d.clinic ? ' — ' + d.clinic : ''}`);
  L.push('');
  if (works.length) {
    L.push('*تفاصيل الشغل:*');
    works.forEach((w, i) => {
      const q = ` (${money(w.qty)} سن × ${money(w.price)})`;
      L.push(`${i + 1}. ${shortDate(w.date)}${w.caseNo ? ' — حالة ' + w.caseNo : ''}${w.patient ? ' — ' + w.patient : ''} — ${w.type}${q}${w.teeth ? ' [' + w.teeth + ']' : ''}: ${money(w.total)} ${c}`);
    });
    L.push('');
    L.push(`مجموع الشغل: ${money(inv.itemsTotal)} ${c}`);
  }
  if (n2(inv.prevBalance) > 0) L.push(`رصيد سابق: ${money(inv.prevBalance)} ${c}`);
  if (n2(inv.prevBalance) < 0) L.push(`رصيد إلك عنا: ${money(-inv.prevBalance)} ${c}`);
  L.push(`*المطلوب: ${money(Math.max(0, inv.due))} ${c}*`);
  if (s.payInfo) { L.push(''); L.push(`طريقة الدفع: ${s.payInfo}`); }
  L.push('');
  L.push(s.footer || 'شكراً لثقتكم 🌟');
  return L.join('\n');
}
function invoiceHtml(inv, d, works) {
  return `<div class="invoice"><div class="ih"><b>فاتورة <span class="num">${esc(inv.number)}</span></b><span class="num">${esc(fmtDate(inv.date))}</span></div>
  <table><tbody>
    <tr><td colspan="2"><b>${esc(docName(d))}</b>${d.clinic ? ' · ' + esc(d.clinic) : ''}</td></tr>
    ${works.map(w => `<tr><td>${esc(w.type)}${n2(w.qty) > 1 ? ` × <span class="num">${money(w.qty)}</span>` : ''}<div class="note"><span class="num">${esc(shortDate(w.date))}</span>${w.patient ? ' · ' + esc(w.patient) : ''}</div></td><td>${M(w.total)}</td></tr>`).join('')}
    ${works.length ? `<tr class="sum"><td>مجموع الشغل</td><td>${M(inv.itemsTotal)}</td></tr>` : ''}
    ${n2(inv.prevBalance) ? `<tr><td>${inv.prevBalance > 0 ? 'رصيد سابق' : 'رصيد إله'}</td><td>${M(Math.abs(inv.prevBalance))}</td></tr>` : ''}
    <tr class="due"><td>المطلوب</td><td>${M(Math.max(0, inv.due))}</td></tr>
  </tbody></table></div>`;
}
function nextNumber() {
  const max = S.invoices.reduce((a, i) => Math.max(a, parseInt(i.number, 10) || 0), 0);
  return String(max + 1).padStart(4, '0');
}
function invoiceSheet(doctorId, existing) {
  const d = docById(doctorId); if (!d) return;
  let inv, works, savedId = existing?.id || null;
  if (existing) {
    inv = existing; works = S.works.filter(w => (existing.workIds || []).includes(w.id));
  } else {
    const st = stats(doctorId);
    works = st.open.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    inv = { number: nextNumber(), date: today(), doctorId, workIds: works.map(w => w.id), itemsTotal: n2(st.openTotal), prevBalance: n2(st.balance - st.openTotal), due: st.balance };
    if (!works.length && st.balance <= 0) { toast('ما في شغل جديد ولا حساب مطلوب'); return; }
  }
  const text = existing?.text || invoiceText(inv, d, works);
  const noPhone = !waNumber(d.phone);
  const hasPh = works.some(w => MEDIA.list.some(m => m.kind === 'work' && m.workId === w.id));
  openSheet(`<h3>${existing ? 'فاتورة قديمة' : works.length ? 'فاتورة جديدة' : 'تذكير بالحساب'}</h3>
    ${hasPh ? `<label class="row" style="gap:8px"><input type="checkbox" id="invPh" checked> حط صور الأسنان بالفاتورة</label>` : ''}
    <img id="invImg" alt="الفاتورة" style="width:100%;border-radius:12px;border:1px solid var(--line);min-height:240px;background:var(--bg)">
    <button class="btn wa full" id="imgBtn" disabled>${WA_ICON} ابعت الفاتورة كصورة</button>
    <p class="note" style="margin:0">بيفتحلك المشاركة ← واتساب ← اختار الدكتور.</p>
    <a class="btn ghost full" id="waBtn" href="${esc(waLink(d.phone, text))}" target="_blank" rel="noopener">ابعتها كنص على الواتس${noPhone ? '' : ''}</a>
    <button class="btn ghost full" id="cpBtn">انسخ نص الفاتورة</button>
    <textarea id="cpTxt" hidden readonly rows="8" style="width:100%;border-radius:12px;padding:10px;border:1px solid var(--line);background:var(--bg)">${esc(text)}</textarea>
    <p class="note" style="margin:0">${existing ? 'بتقدر تعيد بعتها بأي وقت.' : 'لما تضغط «افتح الواتس» الفاتورة بتنحفظ والشغل بيتعلّم إنه مفوتر.'}</p>
    <button class="btn ghost full" data-close>سكّر</button>
    ${existing ? `<div class="confirm" id="delWrap"><button type="button" class="btn danger" id="delBtn">حذف الفاتورة</button></div>` : ''}`, sh => {
    const persist = async () => {
      if (savedId) return;
      savedId = newId();
      const rec = { ...inv, text, createdAt: Date.now() };
      await save('invoices', savedId, rec);
      for (const w of works) await save('works', w.id, { ...strip(w), invoiceId: savedId });
      toast('انحفظت الفاتورة ' + inv.number);
    };
    sh.querySelector('#waBtn').addEventListener('click', () => { persist().catch(() => {}); });
    let file = null; const ib = sh.querySelector('#imgBtn');
    const paint = async () => { ib.disabled = true; const usePh = hasPh && sh.querySelector('#invPh').checked; const cv = await drawInvoice(inv, d, works, usePh ? await workPhotos(works) : []); sh.querySelector('#invImg').src = cv.toDataURL('image/png'); file = await cvFile(cv, `فاتورة-${inv.number}.png`); ib.disabled = false; };
    paint(); if (hasPh) sh.querySelector('#invPh').addEventListener('change', paint);
    ib.onclick = () => { if (!file) return; shareImage(file, `فاتورة رقم ${inv.number} — المطلوب ${money(Math.max(0, inv.due))} ${cur()}`); persist().catch(() => {}); };
    sh.querySelector('#cpBtn').onclick = () => { copyText(text, sh.querySelector('#cpTxt')); persist().catch(() => {}); };
    const del = sh.querySelector('#delBtn');
    if (del) del.onclick = () => {
      sh.querySelector('#delWrap').innerHTML = `<span>الشغل اللي فيها برجع «مش مفوتر».</span><button type="button" class="btn danger" id="yes">احذف</button>`;
      sh.querySelector('#yes').onclick = async () => {
        for (const w of works) await save('works', w.id, { ...strip(w), invoiceId: '' });
        await remove('invoices', existing.id); closeSheet(); toast('انحذفت الفاتورة');
      };
    };
  });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t || t.closest('.sheet')) return;
  if (t.dataset.go) { route = { name: t.dataset.go }; render(); window.scrollTo(0, 0); return; }
  if (t.id === 'fab') { workSheet(null, route.name === 'doctor' ? route.id : null); return; }
  if (t.id === 'backBtn') { route = { name: route.name === 'doctor' ? 'doctors' : 'settings' }; render(); return; }
  if (t.dataset.doc) { route = { name: 'doctor', id: t.dataset.doc, tab: 'works' }; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.tab) { route.tab = t.dataset.tab; render(); return; }
  if (t.dataset.scan) { const m = MEDIA.list.find(x => x.id === t.dataset.scan); if (m) openSheet(`<h3>ورقة</h3><img src="${mUrl(m)}" alt="" style="width:100%;border-radius:12px;background:#fff"><button class="btn primary full" id="sRe">عبّي منها شغل</button><button class="btn ghost full" data-close>سكّر</button>`, sh => { sh.querySelector('#sRe').onclick = () => reviewSheet(m.doctorId, m.id, []); }); return; }
  if (t.dataset.mfilter) { MEDIA.filter = t.dataset.mfilter; render(); return; }
  if (t.dataset.media) {
    const m = MEDIA.list.find(x => x.id === t.dataset.media); if (!m) return;
    if (MEDIA.selecting) { MEDIA.sel.has(m.id) ? MEDIA.sel.delete(m.id) : MEDIA.sel.add(m.id); render(); } else mediaSheet(m);
    return;
  }
  if (t.dataset.work) { workSheet(S.works.find(w => w.id === t.dataset.work)); return; }
  if (t.dataset.pay) { paySheet(S.payments.find(p => p.id === t.dataset.pay)); return; }
  if (t.dataset.inv) { const i = S.invoices.find(x => x.id === t.dataset.inv); if (i) invoiceSheet(i.doctorId, i); return; }
  if (t.dataset.delprice) { const p = { ...(S.settings.prices || {}) }; delete p[t.dataset.delprice]; save('settings', 'main', { ...S.settings, prices: p }); return; }
  const a = t.dataset.act;
  if (a === 'newDoctor') doctorSheet();
  if (a === 'editDoctor') doctorSheet(docById(route.id));
  if (a === 'newWork') workSheet(null, route.id);
  if (a === 'newPay') paySheet(null, route.id);
  if (a === 'invoice') invoiceSheet(route.id);
  if (a === 'backup') exportBackup();
  if (a === 'report') reportSheet(route.id);
  if (a === 'scan') scanStart(route.id);
  if (a === 'remind') remindPrompt(docById(route.id));
  if (a === 'demo') demoInvoice();
  if (a === 'mselect') { MEDIA.selecting = !MEDIA.selecting; MEDIA.sel.clear(); render(); }
  if (a === 'mshareSel') { const items = MEDIA.list.filter(m => MEDIA.sel.has(m.id)); shareFiles(items, items.map(m => m.caption).filter(Boolean).join('\n')); }
});
document.addEventListener('change', e => { if (e.target.id === 'statM') { statMonth = e.target.value; render(); return; } if (e.target.id === 'mFile' && e.target.files.length) { addMedia([...e.target.files]); e.target.value = ''; return; }
 if (e.target.id === 'impFile' && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ''; } });
document.addEventListener('input', e => { if (e.target.id === 'q') { searchQ = e.target.value; $('#docList').innerHTML = doctorRows(); } });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'setForm') return;
  e.preventDefault();
  await save('settings', 'main', { ...S.settings, businessName: $('#sName').value.trim(), phone: $('#sPhone').value.trim(),
    currency: $('#sCur').value.trim(), payInfo: $('#sPayInfo').value.trim(), footer: $('#sFooter').value.trim(), patientMsg: $('#sPMsg').value.trim(), apiKey: $('#sKey').value.trim() });
  toast('انحفظت الإعدادات');
});

/* ---------- boot ---------- */
load();
render();
mediaLoad();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('storage', e => { if (e.key === KEY) { load(); render(); } });
})();
</script>
</body></html>
